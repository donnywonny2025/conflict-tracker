<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR ROOM — Access</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #030308;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BG image */
        .bg-img {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('assets/login-bg.png') center/cover no-repeat;
            filter: brightness(0.35) saturate(0.8);
        }

        .bg-grad {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(20, 80, 220, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(10, 40, 120, 0.08) 0%, transparent 50%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, transparent 30%, transparent 70%, rgba(0, 0, 0, 0.6) 100%);
            pointer-events: none;
        }

        canvas#bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 2;
        }

        .login-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: enterUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes enterUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo-ring {
            width: 72px;
            height: 72px;
            border: 2px solid rgba(40, 120, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            animation: ringPulse 3s ease-in-out infinite;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid rgba(40, 120, 255, 0.1);
            border-radius: 50%;
        }

        @keyframes ringPulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(40, 120, 255, 0.08);
            }

            50% {
                box-shadow: 0 0 40px rgba(40, 120, 255, 0.18);
            }
        }

        .logo-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(40, 120, 255, 0.4));
        }

        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .login-card {
            width: 380px;
            background: rgba(8, 12, 24, 0.88);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(40, 120, 255, 0.1);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 0 0 1px rgba(40, 120, 255, 0.04), 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 120px rgba(20, 60, 180, 0.04);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #00e050;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0, 224, 80, 0.4);
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .status-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(0, 224, 80, 0.7);
            text-transform: uppercase;
        }

        .status-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-left: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: rgba(40, 120, 255, 0.4);
            background: rgba(40, 120, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(40, 120, 255, 0.08);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1050c0, #2080ff);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(32, 128, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .login-btn:hover::after {
            transform: translateX(100%);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider-text {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
        }

        .google-btn {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .google-btn svg {
            width: 16px;
            height: 16px;
        }

        .login-error {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255, 40, 40, 0.08);
            border: 1px solid rgba(255, 40, 40, 0.15);
            border-radius: 4px;
            font-size: 11px;
            color: #ff4040;
            display: none;
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 1px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="bg-img"></div>
    <div class="bg-grad"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="login-wrap">
        <div class="logo-area">
            <div class="logo-ring"><span class="logo-icon">🎯</span></div>
            <div class="logo-title">War Room</div>
            <div class="logo-sub">Intelligence Command Center</div>
        </div>
        <div class="login-card">
            <div class="status-bar">
                <div class="status-dot"></div>
                <span class="status-text">Secure Connection</span>
                <span class="status-time" id="loginClock">--:--:--</span>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Callsign / Name</label>
                    <input class="form-input" type="text" id="userName" placeholder="Enter your name" autocomplete="off"
                        autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Access Code</label>
                    <input class="form-input" type="password" id="accessCode" placeholder="Enter access code"
                        autocomplete="off">
                </div>
                <button class="login-btn" type="submit">Authenticate</button>
            </form>
            <div class="divider">
                <div class="divider-line"></div><span class="divider-text">or</span>
                <div class="divider-line"></div>
            </div>
            <button class="google-btn" id="googleSignInBtn" onclick="triggerGoogleSignIn()">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Sign in with Google
            </button>
            <div class="divider">
                <div class="divider-line"></div><span class="divider-text">family</span>
                <div class="divider-line"></div>
            </div>
            <div class="form-group" style="margin-bottom:8px">
                <input class="form-input" type="email" id="famEmail" placeholder="Email" autocomplete="email"
                    style="margin-bottom:6px;font-size:12px;padding:10px 14px">
                <input class="form-input" type="password" id="famPass" placeholder="Password"
                    autocomplete="current-password" style="font-size:12px;padding:10px 14px">
            </div>
            <button class="google-btn" onclick="handleFamilyLogin()"
                style="border-color:rgba(160,100,220,0.3);color:rgba(160,120,255,0.7)">
                Family Sign In
            </button>
            <div class="login-error" id="loginError"></div>
        </div>
        <div class="login-footer">CLASSIFIED · AUTHORIZED PERSONNEL ONLY</div>
    </div>

    <script>
        // Particle network (blue)
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        class P {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.25; this.vy = (Math.random() - 0.5) * 0.25;
                this.r = Math.random() * 1.2 + 0.5; this.a = Math.random() * 0.25 + 0.05;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new P());
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i]; p.update();
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(40,120,255,${p.a})`; ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 130) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
                        ctx.strokeStyle = `rgba(40,120,255,${0.04 * (1 - d / 130)})`; ctx.lineWidth = 0.5; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        // Clock
        function tick() { const e = document.getElementById('loginClock'); if (e) e.textContent = new Date().toLocaleTimeString('en-US', { hour12: false }); }
        tick(); setInterval(tick, 1000);

        // ── Auth Config ──
        const GOOGLE_CLIENT_ID = '1096103073058-t54mi81smnun2tb80eqd7i4u2tlqcrtd.apps.googleusercontent.com';
        const VALID_CODES = ['warroom', 'admin', 'iran2026'];
        const AUTHORIZED_EMAILS = {
            'donnywonny2023@gmail.com': 'Jeff Kerr',
            'egan.daniel@gmail.com': 'Dan Egan',
            'debbus02@yahoo.com': 'Debbie',
            'linseykerr333@yahoo.com': 'Linsey',
        };
        const FAMILY_LOGINS = [
            { email: 'debbus02@yahoo.com', password: 'disney3838', name: 'Debbie' },
            { email: 'linseykerr333@yahoo.com', password: 'disney3838', name: 'Linsey' },
        ];

        function grantAccess(name, method, email) {
            localStorage.setItem('warroom_auth', JSON.stringify({
                name, email: email || '', method, justLoggedIn: true,
                exp: Date.now() + 7 * 24 * 3600000, loginAt: new Date().toISOString()
            }));
            document.getElementById('loginError').style.display = 'none';
            document.querySelector('.login-btn').textContent = 'ACCESS GRANTED';
            document.querySelector('.login-btn').style.background = 'linear-gradient(135deg,#00a040,#00e050)';
            document.querySelector('.status-text').textContent = 'Authenticated';
            document.querySelector('.status-text').style.color = '#00e050';
            setTimeout(() => { window.location.href = '/'; }, 700);
        }

        // ── Access code login ──
        function handleLogin(e) {
            e.preventDefault();
            const code = document.getElementById('accessCode').value.trim().toLowerCase();
            const userName = document.getElementById('userName').value.trim() || 'Operator';
            const err = document.getElementById('loginError');
            if (!code) { err.textContent = 'Enter an access code'; err.style.display = 'block'; return; }
            if (VALID_CODES.includes(code)) { grantAccess(userName, 'code'); }
            else { err.textContent = 'Invalid access code.'; err.style.display = 'block'; }
        }

        // ── Real Google Sign-In ──
        function handleGoogleCredential(response) {
            // Decode the JWT to get email and name
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            const email = payload.email.toLowerCase();
            const name = payload.name || payload.email.split('@')[0];
            if (AUTHORIZED_EMAILS[email]) {
                grantAccess(AUTHORIZED_EMAILS[email], 'google', email);
            } else {
                const err = document.getElementById('loginError');
                err.textContent = 'Email not authorized. Contact Jeff for access.';
                err.style.display = 'block';
            }
        }

        // Initialize Google Sign-In when the GIS library loads
        function initGoogleSignIn() {
            if (typeof google === 'undefined' || !google.accounts) {
                setTimeout(initGoogleSignIn, 200);
                return;
            }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential,
                auto_select: false,
                ux_mode: 'popup',
            });
        }
        initGoogleSignIn();

        function triggerGoogleSignIn() {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        // Fallback: render the full Google button
                        const btn = document.getElementById('googleSignInBtn');
                        btn.style.display = 'none';
                        const div = document.createElement('div');
                        div.id = 'gsiButtonWrap';
                        div.style.marginTop = '8px';
                        btn.parentNode.insertBefore(div, btn.nextSibling);
                        google.accounts.id.renderButton(div, {
                            theme: 'filled_black', size: 'large', width: '316',
                            text: 'signin_with', shape: 'rectangular',
                        });
                    }
                });
            }
        }

        // ── Family password login (Mom) ──
        function handleFamilyLogin() {
            const email = document.getElementById('famEmail').value.trim().toLowerCase();
            const pass = document.getElementById('famPass').value;
            const err = document.getElementById('loginError');
            if (!email || !pass) { err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
            const match = FAMILY_LOGINS.find(f => f.email === email && f.password === pass);
            if (match) {
                grantAccess(match.name, 'family', email);
            } else {
                err.textContent = 'Invalid email or password.'; err.style.display = 'block';
            }
        }

        // Auto-login if still valid
        try { const a = JSON.parse(localStorage.getItem('warroom_auth') || '{}'); if (a.exp && a.exp > Date.now()) window.location.href = '/'; } catch (e) { }
    </script>
</body>

</html>

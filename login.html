<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR ROOM — Access</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #030308;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Animated gradient background ── */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg,
                    #030308 0%,
                    #060c1a 25%,
                    #0a1428 50%,
                    #081020 75%,
                    #030308 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 0%;
            }

            75% {
                background-position: 0% 100%;
            }
        }

        /* ── Radial overlay ── */
        .bg-radial {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(20, 60, 180, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(180, 40, 40, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Scanline effect ── */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: repeating-linear-gradient(0deg,
                    transparent, transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px);
            pointer-events: none;
        }

        /* ── Moving horizon light ── */
        .horizon-light {
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 100%, rgba(20, 80, 255, 0.05) 0%, transparent 50%);
            animation: horizonPulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes horizonPulse {

            0%,
            100% {
                opacity: 0.4;
                transform: translateY(10px);
            }

            50% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        canvas#bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 3;
        }

        /* ── Login container ── */
        .login-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Staggered entrance animations ── */
        .anim-enter {
            opacity: 0;
            transform: translateY(24px);
            animation: staggerIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-enter:nth-child(1) {
            animation-delay: 0.1s;
        }

        .anim-enter:nth-child(2) {
            animation-delay: 0.25s;
        }

        .anim-enter:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes staggerIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Logo area ── */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo-ring {
            width: 72px;
            height: 72px;
            border: 2px solid rgba(40, 120, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            animation: ringPulse 3s ease-in-out infinite;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid rgba(40, 120, 255, 0.08);
            border-radius: 50%;
            animation: ringSpin 12s linear infinite;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px solid rgba(40, 120, 255, 0.04);
            border-radius: 50%;
            animation: ringSpin 20s linear infinite reverse;
        }

        @keyframes ringPulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(40, 120, 255, 0.06);
            }

            50% {
                box-shadow: 0 0 40px rgba(40, 120, 255, 0.15);
            }
        }

        @keyframes ringeSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* SVG crosshair icon */
        .logo-icon svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 0 8px rgba(40, 120, 255, 0.4));
        }

        .logo-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(40, 120, 255, 0.15);
        }

        .logo-sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* ── Login card ── */
        .login-card {
            width: 400px;
            background: rgba(6, 10, 20, 0.85);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid rgba(40, 120, 255, 0.08);
            border-radius: 12px;
            padding: 32px;
            box-shadow:
                0 0 0 1px rgba(40, 120, 255, 0.03),
                0 24px 80px rgba(0, 0, 0, 0.6),
                0 0 120px rgba(20, 60, 180, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            animation: cardGlow 4s ease-in-out infinite;
        }

        @keyframes cardGlow {

            0%,
            100% {
                border-color: rgba(40, 120, 255, 0.08);
                box-shadow: 0 0 0 1px rgba(40, 120, 255, 0.03), 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 120px rgba(20, 60, 180, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            }

            50% {
                border-color: rgba(40, 120, 255, 0.15);
                box-shadow: 0 0 0 1px rgba(40, 120, 255, 0.06), 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 160px rgba(20, 60, 180, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #00e050;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0, 224, 80, 0.4);
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .status-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(0, 224, 80, 0.7);
            text-transform: uppercase;
        }

        .status-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-left: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: rgba(40, 120, 255, 0.4);
            background: rgba(40, 120, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(40, 120, 255, 0.08), 0 0 20px rgba(40, 120, 255, 0.06);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0e3d8c, #1a6bdb);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(26, 107, 219, 0.35);
            background: linear-gradient(135deg, #1050a0, #2080ff);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .login-btn:hover::after {
            transform: translateX(100%);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider-text {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
        }

        .google-btn {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-1px);
        }

        .google-btn svg {
            width: 16px;
            height: 16px;
        }

        .login-error {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255, 40, 40, 0.08);
            border: 1px solid rgba(255, 40, 40, 0.15);
            border-radius: 4px;
            font-size: 11px;
            color: #ff4040;
            display: none;
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .login-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── Version badge ── */
        .version-badge {
            position: fixed;
            bottom: 12px;
            right: 16px;
            z-index: 20;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 1px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="bg-radial"></div>

    <div class="login-wrap">
        <div class="logo-area anim-enter">

                    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(40,120,255,0.8)" stroke-width="1.5"

                        <line x1="12" y1="2" x2="12" y2="7" />
                        <line x1="12" y1="17" x2="12" y2="22" />

                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"

                    <path fill="#EA4335"

                </svg>

            </button>
            <div class="divider">
                <div class="divider-line"></div><span class="divider-text">family</span>

            <div class="form-group" style="margin-bottom:8px">
                <input class="form-input" type="email" id="famEmail" placeholder="Email" autocomplete="email"
                    style="margin-bottom:6px;font-size:12px;padding:10px 14px">

    <script>
        // ── Enhanced Particle Network ──
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = -1000, mouseY = -1000;

        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        resize();
        addEventListener('resize', resize);
        addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.r = Math.random() * 1.5 + 0.4;
                this.baseAlpha = Math.random() * 0.3 + 0.05;
                this.alpha = this.baseAlpha;
                this.hue = 220 + Math.random() * 30; // blue range
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -20 || this.x > canvas.width + 20) this.vx *= -1;
                if (this.y < -20 || this.y > canvas.height + 20) this.vy *= -1;

                // Mouse interaction — particles glow near cursor
                const dx = this.x - mouseX, dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    this.alpha = this.baseAlpha + (1 - dist / 200) * 0.3;
                    // Gentle push away
                    this.vx += dx / dist * 0.02;
                    this.vy += dy / dist * 0.02;
                } else {
                    this.alpha += (this.baseAlpha - this.alpha) * 0.05;
                }
                // Speed limiter
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 0.8) { this.vx *= 0.98; this.vy *= 0.98; }
            }
        }

        const PARTICLE_COUNT = 90;
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connections first
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update();
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const dx = p.x - q.x, dy = p.y - q.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 160) {
                        const lineAlpha = 0.06 * (1 - d / 160) * (p.alpha + q.alpha);
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.strokeStyle = `rgba(40,120,255,${lineAlpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            // Draw particles on top
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue},70%,60%,${p.alpha})`;
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }
        draw();

        // ── Clock ──
        function tick() {
            const e = document.getElementById('loginClock');
            if (e) e.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
        tick();
        setInterval(tick, 1000);

        // ── Auth Config ──
        const GOOGLE_CLIENT_ID = '1096103073058-t54mi81smnun2tb80eqd7i4u2tlqcrtd.apps.googleusercontent.com';
        const VALID_CODES = ['warroom', 'admin', 'iran2026'];
        const AUTHORIZED_EMAILS = {
            'donnywonny2023@gmail.com': 'Jeff Kerr',
            'egan.daniel@gmail.com': 'Dan Egan',
            'debbus02@yahoo.com': 'Debbie',
            'linseykerr333@yahoo.com': 'Linsey',
        };
        const FAMILY_LOGINS = [
            { email: 'debbus02@yahoo.com', password: 'disney3838', name: 'Debbie' },
            { email: 'linseykerr333@yahoo.com', password: 'disney3838', name: 'Linsey' },
        ];

        function grantAccess(name, method, email) {
            localStorage.setItem('warroom_auth', JSON.stringify({
                name, email: email || '', method, justLoggedIn: true,
                exp: Date.now() + 7 * 24 * 3600000, loginAt: new Date().toISOString()
            }));
            document.getElementById('loginError').style.display = 'none';
            const btn = document.querySelector('.login-btn');
            btn.textContent = 'ACCESS GRANTED';
            btn.style.background = 'linear-gradient(135deg,#00a040,#00e050)';
            btn.style.boxShadow = '0 0 30px rgba(0,224,80,0.3)';
            document.querySelector('.status-text').textContent = 'Authenticated';
            document.querySelector('.status-text').style.color = '#00e050';
            // Card border glow green
            document.querySelector('.login-card').style.borderColor = 'rgba(0,224,80,0.3)';
            setTimeout(() => { window.location.href = '/'; }, 700);
        }

        // ── Access code login ──
        function handleLogin(e) {
            e.preventDefault();
            const code = document.getElementById('accessCode').value.trim().toLowerCase();
            const userName = document.getElementById('userName').value.trim() || 'Operator';
            const err = document.getElementById('loginError');
            if (!code) { err.textContent = 'Enter an access code'; err.style.display = 'block'; return; }
            if (VALID_CODES.includes(code)) { grantAccess(userName, 'code'); }
            else { err.textContent = 'Invalid access code.'; err.style.display = 'block'; }
        }

        // ── Real Google Sign-In ──
        function handleGoogleCredential(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            const email = payload.email.toLowerCase();
            const name = payload.name || payload.email.split('@')[0];
            if (AUTHORIZED_EMAILS[email]) {
                grantAccess(AUTHORIZED_EMAILS[email], 'google', email);
            } else {
                const err = document.getElementById('loginError');
                err.textContent = 'Email not authorized. Contact Jeff for access.';
                err.style.display = 'block';
            }
        }

        function initGoogleSignIn() {
            if (typeof google === 'undefined' || !google.accounts) {
                setTimeout(initGoogleSignIn, 200);
                return;
            }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential,
                auto_select: false,
                ux_mode: 'popup',
            });
        }
        initGoogleSignIn();

        function triggerGoogleSignIn() {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        const btn = document.getElementById('googleSignInBtn');
                        btn.style.display = 'none';
                        const div = document.createElement('div');
                        div.id = 'gsiButtonWrap';
                        div.style.marginTop = '8px';
                        btn.parentNode.insertBefore(div, btn.nextSibling);
                        google.accounts.id.renderButton(div, {
                            theme: 'filled_black', size: 'large', width: '336',
                            text: 'signin_with', shape: 'rectangular',
                        });
                    }
                });
            }
        }

        // ── Family password login ──
        function handleFamilyLogin() {
            const email = document.getElementById('famEmail').value.trim().toLowerCase();
            const pass = document.getElementById('famPass').value;
            const err = document.getElementById('loginError');
            if (!email || !pass) { err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
            const match = FAMILY_LOGINS.find(f => f.email === email && f.password === pass);
            if (match) {
                grantAccess(match.name, 'family', email);
            } else {
                err.textContent = 'Invalid email or password.';
                err.style.display = 'block';
            }
        }

        // Auto-login if still valid
        try {
            const a = JSON.parse(localStorage.getItem('warroom_auth') || '{}');
            if (a.exp && a.exp > Date.now()) window.location.href = '/';
        } catch (e) { }
    </script>
</body>

</html>

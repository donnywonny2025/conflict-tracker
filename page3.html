<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>WAR ROOM — World Monitor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script>
        try {
            const a = JSON.parse(localStorage.getItem('warroom_auth') || '{}');
            if (!a.exp || a.exp < Date.now()) { localStorage.removeItem('warroom_auth'); window.location.href = '/login.html'; }
        }
        catch (e) { window.location.href = '/login.html'; }
    </script>
    <style>
        @view-transition {
            navigation: auto;
        }

        ::view-transition-old(root) {
            animation: fade-out 0.15s ease-out;
        }

        ::view-transition-new(root) {
            animation: fade-in 0.25s ease-in;
        }

        @keyframes fade-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .monitor-frame {
            flex: 1;
            border: none;
            width: 100%;
        }

        /* Override footer for this page */
        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            background: var(--clr-surface);
            border-top: 1px solid var(--clr-border);
            font-size: 8px;
            font-family: var(--font-mono);
            color: var(--clr-muted);
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .footer-bar a {
            color: var(--clr-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-bar a:hover {
            color: var(--clr-red);
        }

        .footer-live {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-dot {
            width: 5px;
            height: 5px;
            background: #0f0;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div class="vignette"></div>

    <!-- ── WAR ROOM HEADER (matching Page 1) ── -->
    <header class="header">
        <div class="header__brand">
            <div class="live-indicator">
                <div class="live-dot"></div>LIVE
            </div>
            <span class="brand-title">War Room</span>
            <span class="mode-label">WORLD MONITOR</span>
        </div>
        <!-- Iran & Israel Clocks -->
        <div style="display:flex;gap:10px;align-items:center;flex-shrink:0;margin:0 8px;">
            <div
                style="display:flex;flex-direction:column;align-items:center;padding:2px 8px;background:rgba(255,32,32,0.08);border:1px solid rgba(255,32,32,0.15);border-radius:4px;">
                <span
                    style="font-size:7px;font-weight:800;letter-spacing:1.5px;color:#ff4040;text-transform:uppercase;">🇮🇷
                    TEHRAN</span>
                <span id="clockTehran"
                    style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#fff;">--:--</span>
            </div>
            <div
                style="display:flex;flex-direction:column;align-items:center;padding:2px 8px;background:rgba(32,128,255,0.08);border:1px solid rgba(32,128,255,0.15);border-radius:4px;">
                <span
                    style="font-size:7px;font-weight:800;letter-spacing:1.5px;color:#2080ff;text-transform:uppercase;">🇮🇱
                    TEL AVIV</span>
                <span id="clockTelAviv"
                    style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#fff;">--:--</span>
            </div>
        </div>
        <div class="header__controls">
            <span class="clock" id="clock"></span>
            <a href="/" class="nav-btn">COMMAND CENTER</a>
            <a href="/groundviews.html" class="nav-btn">GROUND VIEWS</a>
            <button class="nav-btn"
                style="background:rgba(232,72,85,0.15);border-color:rgba(232,72,85,0.3);color:#e84855;cursor:default;">WORLD
                MONITOR</button>
            <button class="nav-btn" onclick="toggleFullscreen()">Fullscreen</button>
            <button class="nav-btn"
                onclick="localStorage.removeItem('warroom_auth'); window.location.href='/login.html'"
                style="background:rgba(255,32,32,0.12);border-color:rgba(255,32,32,0.3);color:#ff4040;">⏻
                Logout</button>
        </div>
    </header>

    <!-- ── WORLD MONITOR EMBED ── -->
    <iframe class="monitor-frame" src="http://localhost:3333/" allow="autoplay; fullscreen; encrypted-media"></iframe>

    <script>
        // ── Clocks (12-hour format matching Page 1) ──
        function tickClocks() {
            const now = new Date();
            const fmt = (tz) => now.toLocaleTimeString('en-US', {
                timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            });
            document.getElementById('clockTehran').textContent = fmt('Asia/Tehran');
            document.getElementById('clockTelAviv').textContent = fmt('Asia/Jerusalem');
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            }) + ' EST';
        }
        tickClocks();
        setInterval(tickClocks, 1000);

        // Fullscreen toggle
        const app = {
            toggleFullscreen() {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            }
        };
    </script>
</body>

</html>

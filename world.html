<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD MONITOR — Global News Streams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://img.youtube.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/world.css">
</head>

<body>
    <header class="hdr">
        <span class="hdr__live">LIVE</span>
        <span class="hdr__title">🌍 WORLD MONITOR</span>
        <span class="hdr__count" id="cnt">0</span>
        <select id="gs" onchange="setGrid(this.value)">
            <option value="2">2 col</option>
            <option value="3">3 col</option>
            <option value="4" selected>4 col</option>
            <option value="5">5 col</option>
            <option value="6">6 col</option>
        </select>
        <button onclick="playAll()">▶ Play All</button>
        <button onclick="resetGrid()">⏹ Reset</button>
        <a href="/" class="hdr__link">← War Room</a>
    </header>
    <div class="filters" id="flt"></div>
    <div class="grid c4" id="grid"></div>
    <footer class="ftr">
        <span>WORLD MONITOR</span>
        <div class="ftr__r">
            <span class="ftr__dot"></span>
            <span id="fcnt">0</span>
            <span id="clk"></span>
        </div>
    </footer>

    <!-- Data first, then controller -->
    <script src="data/streams.js"></script>
    <script src="js/world.js"></script>
</body>

</html>
